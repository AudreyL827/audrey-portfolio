<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2260" viewBox="0 0 1440 2260" xml:space="preserve">
<title>Audrey Li portfolio, work index</title>
<rect width="1440" height="2260" fill="#f4f0e7"/>
<text x="160" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#17150f">AL</text>
<path d="M160 140 C172 136 184 141 196 138 c10 -2 20 1 22 -2" fill="none" stroke="#a85c50" stroke-width="2" stroke-linecap="round"/>
<text x="1003" y="126" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1f3bae">Work</text>
<text x="1076" y="126" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#17150f">About</text>
<text x="1156" y="126" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#17150f">Contact</text>
<text x="1247" y="126" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b564a">Dark</text>
<text x="160" y="334" font-family="Georgia, 'Times New Roman', serif" font-size="60" fill="#17150f" >Work</text>
<text x="160" y="388" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#17150f" >Everything I am building right now, including the parts</text>
<text x="160" y="420" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#17150f" >that are not written up yet. A row without a link means</text>
<text x="160" y="452" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#17150f" >the project exists but the documentation does not.</text>
<text x="160" y="538" font-family="Caveat, 'Bradley Hand', cursive" font-size="26" fill="#a85c50" >Writing these up one at a time. Nooki</text>
<text x="160" y="570" font-family="Caveat, 'Bradley Hand', cursive" font-size="26" fill="#a85c50" >is next.</text>
<text x="160" y="685" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b564a" letter-spacing="1.1" font-weight="500">PROJECTS</text>
<rect x="160" y="694" width="1120" height="1" fill="#d6cfbe"/>
<rect x="160" y="735" width="1120" height="1" fill="#d6cfbe"/>
<text x="160" y="782" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#1f3bae" >Nooki</text>
<text x="524" y="775" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >A gamified Pomodoro progressive web app. Finished focus</text>
<text x="524" y="803" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >sessions become collectible progress in a small room, and</text>
<text x="524" y="831" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >there is an accomplishment journal for what you got done.</text>
<text x="524" y="859" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >React, Vite, Firebase Authentication and Firestore, Spotify</text>
<text x="524" y="887" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >integration, notifications and analytics, on phone and</text>
<text x="524" y="915" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >desktop.</text>
<text x="1280" y="771" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1.1" fill="#a85c50">LIVE, CASE STUDY IN PROGRESS</text>
<rect x="160" y="948" width="1120" height="1" fill="#d6cfbe"/>
<text x="160" y="995" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#17150f" >Three.js portfolio room</text>
<text x="524" y="988" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >A black and white 3D room you move through instead of scroll,</text>
<text x="524" y="1016" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >with an astronaut, a tesseract, candles, a wormhole,</text>
<text x="524" y="1044" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >paintings, a female statue and an art deco cat. Navigation is</text>
<text x="524" y="1072" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >closer to a small game than a website.</text>
<text x="1280" y="984" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1.1" fill="#a85c50">IN PROGRESS</text>
<rect x="160" y="1105" width="1120" height="1" fill="#d6cfbe"/>
<text x="160" y="1152" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#1f3bae" >Internal Fellowship Program</text>
<text x="160" y="1182" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#1f3bae" >partner package</text>
<text x="524" y="1145" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >A file the UBC Product Management Club sends to companies so</text>
<text x="524" y="1173" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >they can understand the fellowship program without a</text>
<text x="524" y="1201" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >walkthrough. I worked on the content structure and visual</text>
<text x="524" y="1229" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >hierarchy.</text>
<text x="1280" y="1141" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1.1" fill="#a85c50">WRITTEN UP</text>
<rect x="160" y="1262" width="1120" height="1" fill="#d6cfbe"/>
<text x="160" y="1309" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#1f3bae" >BUCS website</text>
<text x="524" y="1302" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >The site for the BUCS community. I work on it in Figma with</text>
<text x="524" y="1330" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >prototypes and Dev Mode, alongside the people building it. It</text>
<text x="524" y="1358" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >has passed 2,000 visits.</text>
<text x="1280" y="1298" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1.1" fill="#a85c50">LIVE, ONGOING</text>
<rect x="160" y="1391" width="1120" height="1" fill="#d6cfbe"/>
<text x="160" y="1438" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#17150f" >BUCS coffee-chat matching</text>
<text x="524" y="1431" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >A feature to connect prospective students, current students</text>
<text x="524" y="1459" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >and alumni more efficiently by matching them for coffee chats.</text>
<text x="524" y="1487" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >I am product managing it.</text>
<text x="1280" y="1427" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1.1" fill="#a85c50">IN PROGRESS</text>
<rect x="160" y="1520" width="1120" height="1" fill="#d6cfbe"/>
<text x="160" y="1630" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b564a" letter-spacing="1.1" font-weight="500">NOTES AND EXPERIMENTS</text>
<rect x="160" y="1639" width="1120" height="1" fill="#d6cfbe"/>
<rect x="160" y="1680" width="1120" height="1" fill="#d6cfbe"/>
<text x="160" y="1727" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#17150f" >DayWheel</text>
<text x="524" y="1720" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >A React and Vite project of mine. I have not written up what</text>
<text x="524" y="1748" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >it does or exported screenshots yet, so it sits here as a</text>
<text x="524" y="1776" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >title until I do.</text>
<text x="1280" y="1716" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1.1" fill="#a85c50">NOT DOCUMENTED YET</text>
<rect x="160" y="1809" width="1120" height="1" fill="#d6cfbe"/>
<text x="160" y="1856" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#17150f" >Blender self-portrait box</text>
<text x="524" y="1849" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >A small room modelled around four words I would use for</text>
<text x="524" y="1877" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >myself: cozy, dreamy, sporty, artistic. Inside it are a lucky</text>
<text x="524" y="1905" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >cat, a suitcase, a cafe sign, a laptop, a plant, bamboo and an</text>
<text x="524" y="1933" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >epee.</text>
<text x="1280" y="1845" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1.1" fill="#a85c50">RENDERS NOT EXPORTED YET</text>
<rect x="160" y="1966" width="1120" height="1" fill="#d6cfbe"/>
<text x="160" y="2076" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b564a" letter-spacing="1.1" font-weight="500">COMMUNITIES AND TEACHING</text>
<rect x="160" y="2085" width="1120" height="1" fill="#d6cfbe"/>
<rect x="160" y="2126" width="1120" height="1" fill="#d6cfbe"/>
<text x="160" y="2173" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#17150f" >UBC Product Management Club</text>
<text x="524" y="2166" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >Executive Development Program Manager. More than 800 members</text>
<text x="524" y="2194" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >and more than 40 executives. I contact speakers, prepare</text>
<text x="524" y="2222" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >workshop decks, host sessions, contribute to partnership</text>
<text x="524" y="2250" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >materials and run the FigJam debrief after each event.</text>
<text x="1280" y="2162" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1.1" fill="#a85c50">ONGOING</text>
<rect x="160" y="2283" width="1120" height="1" fill="#d6cfbe"/>
<text x="160" y="2330" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#17150f" >BUCS Community Team</text>
<text x="524" y="2323" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >Vice President. Students and alumni from UBC’s Combined Major</text>
<text x="524" y="2351" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >in Business and Computer Science, with more than 150 people in</text>
<text x="524" y="2379" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >the Discord. I plan educational and social events.</text>
<text x="1280" y="2319" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1.1" fill="#a85c50">ONGOING</text>
<rect x="160" y="2412" width="1120" height="1" fill="#d6cfbe"/>
<text x="160" y="2459" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#17150f" >Beginner Figma workshop</text>
<text x="524" y="2452" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >A beginner session for the Product Management Club. The</text>
<text x="524" y="2480" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >exercise was a Duolingo redesign, so everyone had a familiar</text>
<text x="524" y="2508" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >interface in front of them while they learned the tool.</text>
<text x="1280" y="2448" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1.1" fill="#a85c50">TAUGHT</text>
<rect x="160" y="2541" width="1120" height="1" fill="#d6cfbe"/>
<rect x="160" y="2170" width="1120" height="1" fill="#d6cfbe"/>
<text x="160" y="2204" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b564a">Audrey Li, Vancouver. Updated August 2026.</text>
<text x="1075" y="2204" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b564a">GitHub</text>
<text x="1139" y="2204" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b564a">Figma</text>
<text x="1197" y="2204" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b564a">BUCS</text>
<text x="1248" y="2204" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b564a">Email</text>
