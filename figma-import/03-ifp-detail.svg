<text x="1003" y="126" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1f3bae">Work</text>
<text x="1076" y="126" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#17150f">About</text>
<text x="1156" y="126" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#17150f">Contact</text>
<text x="1247" y="126" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b564a">Dark</text>
<text x="160" y="291" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#a85c50" >03 /</text>
<text x="160" y="368" font-family="Georgia, 'Times New Roman', serif" font-size="60" fill="#17150f" >Internal Fellowship Program</text>
<text x="160" y="434" font-family="Georgia, 'Times New Roman', serif" font-size="60" fill="#17150f" >partner package</text>
<text x="160" y="481" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b564a" letter-spacing="1.1">CONTENT STRUCTURE</text>
<text x="323" y="481" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b564a" letter-spacing="1.1">VISUAL HIERARCHY</text>
<text x="478" y="481" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b564a" letter-spacing="1.1">FIGMA</text>
<rect x="160" y="538" width="1120" height="1" fill="#d6cfbe"/>
<text x="160" y="574" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b564a" letter-spacing="1.1">TEAM</text>
<text x="160" y="602" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >UBC Product Management Club</text>
<text x="540" y="574" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b564a" letter-spacing="1.1">MY PART</text>
<text x="540" y="602" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >I contributed to the content structure</text>
<text x="540" y="630" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >and the visual hierarchy</text>
<text x="920" y="574" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b564a" letter-spacing="1.1">WHERE IT WENT</text>
<text x="920" y="602" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >Outreach to more than 20 companies</text>
<rect x="160" y="721" width="1120" height="630" fill="#e9e3d5" stroke="#d6cfbe"/>
<text x="176" y="751" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b564a">assets/ifp-cover.png</text>
<rect x="160" y="1360" width="1120" height="1" fill="#d6cfbe"/>
<text x="160" y="1378" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b564a">fig. 01</text>
<text x="218" y="1378" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b564a">Cover of the partner package</text>
<text x="160" y="1489" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#17150f" >What it is</text>
<text x="160" y="1530" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >The UBC Product Management Club needed a package that could explain its Internal</text>
<text x="160" y="1558" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >Fellowship Program to prospective partners without a separate walkthrough. I worked</text>
<text x="160" y="1586" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >on the content structure and visual hierarchy so someone could scan the file and</text>
<text x="160" y="1614" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >understand the program, the partnership options, and what to do next. The team has</text>
<text x="160" y="1642" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >used the package in outreach to more than 20 companies.</text>
<text x="160" y="1755" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#17150f" >What I worked on</text>
<text x="160" y="1796" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >I contributed to the package rather than designing every page of it. My part was the</text>
<text x="160" y="1824" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >order of the content and how a reader moves through it. A company opening the file</text>
<text x="160" y="1852" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >for the first time needs the program explained before the ask, the partnership</text>
<text x="160" y="1880" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >options laid out where they are easy to compare, and a clear next step at the end.</text>
<text x="160" y="1922" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >The file is sent ahead of any conversation, so it has to answer the obvious</text>
<text x="160" y="1950" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >questions on its own. I worked on the hierarchy with that in mind, so the lines that</text>
<text x="160" y="1978" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >matter are the ones a reader lands on while skimming.</text>
<rect x="224" y="2061" width="1056" height="594" fill="#e9e3d5" stroke="#d6cfbe"/>
<text x="240" y="2091" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b564a">assets/ifp-spread-01.png</text>
<rect x="224" y="2664" width="1056" height="1" fill="#d6cfbe"/>
<text x="224" y="2682" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b564a">fig. 02</text>
<text x="282" y="2682" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b564a">Program explanation</text>
<text x="160" y="2727" font-family="Caveat, 'Bradley Hand', cursive" font-size="26" fill="#a85c50" >Spreads still exporting from</text>
<text x="160" y="2759" font-family="Caveat, 'Bradley Hand', cursive" font-size="26" fill="#a85c50" >Figma.</text>
<text x="160" y="2855" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#17150f" >Where it sits in the club</text>
<text x="160" y="2896" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >I am the Executive Development Program Manager for the club, which has more than 800</text>
<text x="160" y="2924" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >members and more than 40 executives. Partnership materials sit next to the rest of</text>
<text x="160" y="2952" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >that work: contacting speakers, preparing workshop decks, hosting sessions and</text>
<text x="160" y="2980" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >running the debrief in FigJam afterwards.</text>
<rect x="160" y="3051" width="1120" height="630" fill="#e9e3d5" stroke="#d6cfbe"/>
<text x="176" y="3081" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b564a">assets/ifp-spread-02.png</text>
<rect x="160" y="3690" width="1120" height="1" fill="#d6cfbe"/>
<text x="160" y="3708" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b564a">fig. 03</text>
<text x="218" y="3708" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b564a">Partnership options</text>
<text x="160" y="3819" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#17150f" >What is still missing from this page</text>
<text x="160" y="3860" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >The exported spreads are not all here yet, and I have not written up what changed</text>
<text x="160" y="3888" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >between drafts. The full file is public in Figma in the meantime.</text>
<text x="160" y="3930" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#1f3bae" >Open the package in Figma →</text>
<text x="1280" y="4018" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#1f3bae">Back to all work →</text>
