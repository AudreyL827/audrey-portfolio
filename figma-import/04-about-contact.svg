<text x="428" y="1307" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#1f3bae">Figma work sample</text>
<text x="600" y="1307" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#1f3bae">BUCS website</text>
<rect x="160" y="1470" width="1120" height="1" fill="#d6cfbe"/>
<text x="160" y="1504" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b564a">Audrey Li, Vancouver. Updated August 2026.</text>
