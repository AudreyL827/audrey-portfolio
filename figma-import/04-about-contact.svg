<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1560" viewBox="0 0 1440 1560" xml:space="preserve">
<title>Audrey Li portfolio, about and contact</title>
<rect width="1440" height="1560" fill="#f4f0e7"/>
<text x="160" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#17150f">AL</text>
<path d="M160 140 C172 136 184 141 196 138 c10 -2 20 1 22 -2" fill="none" stroke="#a85c50" stroke-width="2" stroke-linecap="round"/>
<text x="1003" y="126" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#17150f">Work</text>
<text x="1076" y="126" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#1f3bae">About</text>
<text x="1156" y="126" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#17150f">Contact</text>
<text x="1247" y="126" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b564a">Dark</text>
<text x="160" y="334" font-family="Georgia, 'Times New Roman', serif" font-size="60" fill="#17150f" >About</text>
<text x="160" y="388" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#17150f" >I study Business and Computer Science at UBC in</text>
<text x="160" y="420" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#17150f" >Vancouver. Most of my time goes to two things: building</text>
<text x="160" y="452" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#17150f" >products of my own, and running programs for student</text>
<text x="160" y="484" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#17150f" >communities on campus.</text>
<text x="160" y="570" font-family="Caveat, 'Bradley Hand', cursive" font-size="26" fill="#a85c50" >Still writing this page. The work index</text>
<text x="160" y="602" font-family="Caveat, 'Bradley Hand', cursive" font-size="26" fill="#a85c50" >is more current.</text>
<text x="160" y="717" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b564a" letter-spacing="1.1" font-weight="500">RIGHT NOW</text>
<rect x="160" y="726" width="1120" height="1" fill="#d6cfbe"/>
<text x="160" y="784" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >I am building Nooki, a gamified Pomodoro app where a finished</text>
<text x="160" y="812" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >focus session turns into collectible progress in a small room.</text>
<text x="160" y="840" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >Next to it I am modelling a 3D portfolio room in Three.js,</text>
<text x="160" y="868" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >which is the strangest thing on this site and the one I keep</text>
<text x="160" y="896" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >going back to.</text>
<text x="160" y="938" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >On campus I am the Executive Development Program Manager for</text>
<text x="160" y="966" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >the UBC Product Management Club and Vice President of the BUCS</text>
<text x="160" y="994" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >Community Team. That means speakers, workshop decks, events,</text>
<text x="160" y="1022" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >debriefs, and product work on the BUCS website and its</text>
<text x="160" y="1050" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >coffee-chat feature.</text>
<text x="760" y="784" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >Figma is where a lot of this starts. I use it for workshop</text>
<text x="760" y="812" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >decks, partner materials and website prototypes, and I hand</text>
<text x="760" y="840" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >work off through Dev Mode. I taught the beginner Figma</text>
<text x="760" y="868" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >workshop for the club using a Duolingo redesign. It is one of</text>
<text x="760" y="896" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >the tools I use, not the whole job.</text>
<text x="760" y="938" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >Away from the screen I fence. I have competed, coached younger</text>
<text x="760" y="966" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#17150f" >athletes and worked as a certified referee.</text>
<text x="160" y="1184" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b564a" letter-spacing="1.1" font-weight="500">CONTACT</text>
<rect x="160" y="1193" width="1120" height="1" fill="#d6cfbe"/>
<text x="160" y="1256" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#17150f" >Email is the best way to reach me.</text>
<text x="160" y="1307" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#1f3bae">4udr3y.li@gmail.com</text>
