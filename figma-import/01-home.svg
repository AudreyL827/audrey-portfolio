<text x="160" y="4645" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#17150f" >Audrey Li. Combined Major in Business and Computer Science,</text>
<text x="160" y="4677" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#17150f" >University of British Columbia, Vancouver. I build my own product</text>
<text x="160" y="4709" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#17150f" >ideas, I work on student communities, and I keep a few 3D and</text>
<text x="160" y="4741" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#17150f" >creative-code experiments running next to all of it.</text>
