<text x="936" y="4441" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b564a">fig. 05</text>
<text x="994" y="4441" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b564a">Fencing</text>
<text x="160" y="4006" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#17150f" >I fence. I have competed, coached younger athletes and</text>
<text x="160" y="4038" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#17150f" >worked as a certified referee.</text>
<text x="160" y="4085" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#5b564a" >Results and coaching details go here once I pull them from my resume.</text>
<text x="160" y="4573" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5b564a" letter-spacing="1.1" font-weight="500">ABOUT</text>
